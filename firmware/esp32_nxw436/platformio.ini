[platformio]
default_envs = native
test_dir = test/native

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_semantic
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
test_ignore = *

[env:esp32dev_readonly]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -D NXW436_M3_READONLY=1
test_ignore = *
